name: Application checks
on:
  pull_request:
  push:
    branches: [prototype/railway]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m coverage run tools/testing/run_regressions.py
      - name: Assertion effectiveness (13 probes)
        run: python tools/testing/probe_regressions.py
      - name: Existing demo regression
        env:
          DJANGO_SETTINGS_MODULE: SPDWEBAPP_CORE.testing.demo_settings
        run: python -m coverage run --append SPDWEBAPP/manage.py test railway_demo --noinput
      - name: Configuration and migration drift
        env:
          DJANGO_SETTINGS_MODULE: SPDWEBAPP_CORE.testing.settings
        run: |
          python SPDWEBAPP/manage.py check
          python SPDWEBAPP/manage.py makemigrations --check --dry-run
          python SPDWEBAPP/manage.py spectacular --file work/openapi.yaml --validate --fail-on-warn
      - run: python -m unittest discover -s tools/file_tree -p 'test_*.py'
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build bundled image
        run: docker build -t codex-spd-ci .
      - name: Start isolated image
        run: docker run -d --name codex-spd-ci -p 127.0.0.1:8766:8000 codex-spd-ci
      - name: Browser checks against built image
        env:
          FRONTEND_TEST_URL: http://127.0.0.1:8766
        run: npm run test:e2e --prefix frontend
      - name: Stop test image
        if: always()
        run: docker rm -f codex-spd-ci || true
      - name: Coverage report
        if: always()
        run: |
          python -m coverage report
          python -m coverage xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: |
            work/test-results.json
            work/mutation-results.json
            coverage.xml
            work/openapi.yaml
            frontend/test-results
