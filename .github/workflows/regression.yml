name: Backend regression
on:
  pull_request:
  push:
    branches: [prototype/railway]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m coverage run tools/testing/run_regressions.py
      - name: Assertion effectiveness (13 probes)
        run: python tools/testing/probe_regressions.py
      - name: Existing demo regression
        env:
          DJANGO_SETTINGS_MODULE: SPDWEBAPP_CORE.testing.demo_settings
        run: python -m coverage run --append SPDWEBAPP/manage.py test railway_demo --noinput
      - name: Configuration and migration drift
        env:
          DJANGO_SETTINGS_MODULE: SPDWEBAPP_CORE.testing.settings
        run: |
          python SPDWEBAPP/manage.py check
          python SPDWEBAPP/manage.py makemigrations --check --dry-run
      - run: python -m unittest discover -s tools/file_tree -p 'test_*.py'
      - name: Coverage report
        if: always()
        run: |
          python -m coverage report
          python -m coverage xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: |
            work/test-results.json
            work/mutation-results.json
            coverage.xml
